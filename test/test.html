<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="author" href="mailto:masonf@chromium.org">
<link rel="help" href="https://open-ui.org/components/interest-invokers.explainer/">

<!-- Pre-existing elements in the initial HTML to verify eager page-load setup -->
<div id="preexisting_fixture" style="position:fixed;top:-9999px;left:-9999px">
  <!-- Case A: icon-only button, plain hint -->
  <button type="button" id="pre_a" interestfor="pre_tip_a"></button>
  <div id="pre_tip_a" popover="hint">Alpha</div>

  <!-- Case B: aria-label matching plain hint -->
  <button type="button" id="pre_b" aria-label="Bravo" interestfor="pre_tip_b"></button>
  <div id="pre_tip_b" popover="hint">Bravo</div>

  <!-- Case C: aria-labelledby pointing at plain hint -->
  <button type="button" id="pre_c" aria-labelledby="pre_tip_c" interestfor="pre_tip_c"></button>
  <div id="pre_tip_c" popover="hint">Charlie</div>

  <!-- Case D: inner text matching plain hint -->
  <button type="button" id="pre_d" interestfor="pre_tip_d">Delta</button>
  <div id="pre_tip_d" popover="hint">Delta</div>

  <!-- Case E: icon-only button, plain hint with display:none -->
  <button type="button" id="pre_e" interestfor="pre_tip_e"></button>
  <div id="pre_tip_e" popover="hint" style="display:none">Echo</div>

  <!-- Case F: distinct plain hint text (should become aria-describedby) -->
  <button type="button" id="pre_f" interestfor="pre_tip_f">Edit</button>
  <div id="pre_tip_f" popover="hint">Modify account settings</div>

  <!-- Rich hint in initial HTML -->
  <button type="button" id="pre_rich" interestfor="pre_tip_rich">Profile</button>
  <div id="pre_tip_rich" popover="auto"><a href="#details">View profile</a></div>
</div>

<script>
async function runTests() {
  // =========================================================================
  section("1. Accessibility: Plain & Rich Hints (Eager Init & Mutations)");
  // =========================================================================

  await test("Pre-existing plain hints A-F have accessibility attributes set on page load before any interaction", () => {
    const preA = document.getElementById("pre_a");
    assert_equals(preA.getAttribute("aria-labelledby"), "pre_tip_a", "Case A aria-labelledby");
    assert_equals(preA.getAttribute("aria-describedby"), null, "Case A aria-describedby");

    const preB = document.getElementById("pre_b");
    assert_equals(preB.getAttribute("aria-labelledby"), null, "Case B aria-labelledby");
    assert_equals(preB.getAttribute("aria-describedby"), null, "Case B aria-describedby");

    const preC = document.getElementById("pre_c");
    assert_equals(preC.getAttribute("aria-labelledby"), "pre_tip_c", "Case C aria-labelledby");
    assert_equals(preC.getAttribute("aria-describedby"), null, "Case C aria-describedby");

    const preD = document.getElementById("pre_d");
    assert_equals(preD.getAttribute("aria-labelledby"), null, "Case D aria-labelledby");
    assert_equals(preD.getAttribute("aria-describedby"), null, "Case D aria-describedby");

    const preE = document.getElementById("pre_e");
    assert_equals(preE.getAttribute("aria-labelledby"), "pre_tip_e", "Case E aria-labelledby");
    assert_equals(preE.getAttribute("aria-describedby"), null, "Case E aria-describedby");

    const preF = document.getElementById("pre_f");
    assert_equals(preF.getAttribute("aria-labelledby"), null, "Case F aria-labelledby");
    assert_equals(preF.getAttribute("aria-describedby"), "pre_tip_f", "Case F aria-describedby");
  });

  await test("Pre-existing rich hint has aria-details, aria-expanded=false, and role=tooltip on page load", () => {
    const preRich = document.getElementById("pre_rich");
    const preTipRich = document.getElementById("pre_tip_rich");
    assert_equals(preRich.getAttribute("aria-details"), "pre_tip_rich");
    assert_equals(preRich.getAttribute("aria-expanded"), "false");
    assert_equals(preTipRich.getAttribute("role"), "tooltip");
  });

  await test("Plain hint with distinct aria-label on invoker sets aria-describedby", async () => {
    const { invoker, target } = createPair({
      invokerAttrs: { "aria-label": "Bold" },
      invokerHTML: "",
      popoverType: "hint",
      targetHTML: "Bold (Cmd+B)",
    });
    await nextTick();
    assert_equals(invoker.getAttribute("aria-labelledby"), null);
    assert_equals(invoker.getAttribute("aria-describedby"), target.id);
  });

  await test("Plain hint respects <img alt>, <label>, title, and ignores aria-hidden children", async () => {
    // 1. <img alt="Save"> with distinct hint -> aria-describedby
    const { invoker: imgBtn, target: imgTip } = createPair({
      invokerHTML: '<img alt="Save">',
      popoverType: "hint",
      targetHTML: "Save document",
    });
    // 2. <img alt="Save"> with matching hint -> no aria-describedby
    const { invoker: imgSameBtn } = createPair({
      invokerHTML: '<img alt="Save">',
      popoverType: "hint",
      targetHTML: "Save",
    });
    // 3. <img alt=""> (decorative) + <span aria-hidden="true">icon</span> -> no name -> aria-labelledby
    const { invoker: decBtn, target: decTip } = createPair({
      invokerHTML: '<img alt=""><span aria-hidden="true">*</span>',
      popoverType: "hint",
      targetHTML: "Favorite",
    });
    // 4. Associated <label>
    const lbl = document.createElement("label");
    lbl.htmlFor = "labeled_btn";
    lbl.textContent = "Search";
    sandbox.appendChild(lbl);
    const { invoker: lblBtn, target: lblTip } = createPair({
      invokerAttrs: { id: "labeled_btn" },
      invokerHTML: "",
      popoverType: "hint",
      targetHTML: "Search the site",
    });
    // 5. title attribute
    const { invoker: titleBtn, target: titleTip } = createPair({
      invokerAttrs: { title: "Settings" },
      invokerHTML: "",
      popoverType: "hint",
      targetHTML: "Open settings",
    });

    await nextTick();
    assert_equals(imgBtn.getAttribute("aria-describedby"), imgTip.id, "img alt distinct");
    assert_equals(imgSameBtn.getAttribute("aria-describedby"), null, "img alt matching");
    assert_equals(imgSameBtn.getAttribute("aria-labelledby"), null, "img alt matching no labelledby");
    assert_equals(decBtn.getAttribute("aria-labelledby"), decTip.id, "decorative children -> labelledby");
    assert_equals(decBtn.getAttribute("aria-describedby"), null, "decorative children -> no describedby");
    assert_equals(lblBtn.getAttribute("aria-describedby"), lblTip.id, "<label> provides name -> describedby");
    assert_equals(titleBtn.getAttribute("aria-describedby"), titleTip.id, "title provides name -> describedby");
  });

  await test("Plain vs. Rich hint classification (focusables, headings/lists, ARIA roles)", async () => {
    // Plain hint with allowed role (generic, presentation, none, image)
    const { invoker: plainInv, target: plainTip } = createPair({
      invokerHTML: "Info",
      popoverType: "hint",
      targetHTML: '<span role="generic">Plain text</span><span role="presentation">!</span>',
    });
    // Rich hint because of focusable link inside popover="hint"
    const { invoker: focusInv, target: focusTip } = createPair({
      invokerHTML: "Link hint",
      popoverType: "hint",
      targetHTML: 'Text with <a href="#">link</a>',
    });
    // Rich hint because of structural heading inside popover="hint"
    const { invoker: structInv, target: structTip } = createPair({
      invokerHTML: "Heading hint",
      popoverType: "hint",
      targetHTML: "<h3>Title</h3><p>Body</p>",
    });
    // Rich hint because of non-trivial ARIA role inside popover="hint"
    const { invoker: roleInv, target: roleTip } = createPair({
      invokerHTML: "Role hint",
      popoverType: "hint",
      targetHTML: '<div role="region">Region text</div>',
    });

    await nextTick();
    assert_equals(plainInv.getAttribute("aria-describedby"), plainTip.id, "allowed roles remain plain hint");
    assert_equals(plainInv.getAttribute("aria-details"), null);

    for (const [inv, tip, label] of [
      [focusInv, focusTip, "focusable"],
      [structInv, structTip, "structural"],
      [roleInv, roleTip, "ARIA role"],
    ]) {
      assert_equals(inv.getAttribute("aria-details"), tip.id, `${label} -> aria-details`);
      assert_equals(inv.getAttribute("aria-expanded"), "false", `${label} -> aria-expanded`);
      assert_equals(tip.getAttribute("role"), "tooltip", `${label} -> role=tooltip`);
    }
  });

  await test("Delayed target insertion (invokersMissingTarget) sets up accessibility when target arrives", async () => {
    const invoker = document.createElement("button");
    invoker.setAttribute("interestfor", "delayed_target");
    sandbox.appendChild(invoker);
    await nextTick();
    assert_equals(invoker.getAttribute("aria-labelledby"), null);

    const target = document.createElement("div");
    target.id = "delayed_target";
    target.setAttribute("popover", "hint");
    target.textContent = "Arrived later";
    sandbox.appendChild(target);
    await nextTick();
    assert_equals(invoker.getAttribute("aria-labelledby"), "delayed_target");
  });

  // =========================================================================
  section("2. Element Validity & interestForElement IDL");
  // =========================================================================

  await test("interestForElement IDL reflection and tree scope resolution", () => {
    const { invoker, target } = createPair();
    assert_equals(invoker.interestForElement, target, "reflects IDREF target");

    const otherTarget = document.createElement("div");
    sandbox.appendChild(otherTarget);
    invoker.interestForElement = otherTarget;
    assert_equals(invoker.getAttribute("interestfor"), "", "explicit element sets empty attr");
    assert_equals(invoker.interestForElement, otherTarget, "returns explicit target");

    // Changing attribute to non-empty ID clears explicit target
    invoker.setAttribute("interestfor", target.id);
    assert_equals(invoker.interestForElement, target, "reverts to IDREF lookup");

    // Setting null removes attribute
    invoker.interestForElement = null;
    assert_false(invoker.hasAttribute("interestfor"), "null removes attribute");
    assert_equals(invoker.interestForElement, null);

    assert_throws_js(
      TypeError,
      () => {
        invoker.interestForElement = "not-an-element";
      },
      "non-Element throws TypeError"
    );
  });

  await test("Shadow DOM tree-scope rules for interestForElement and InterestEvent.source retargeting", async () => {
    const outerTarget = document.createElement("div");
    outerTarget.id = "outer_target";
    outerTarget.setAttribute("popover", "auto");
    sandbox.appendChild(outerTarget);

    const host = document.createElement("div");
    const shadow = host.attachShadow({ mode: "open" });
    const shadowBtn = document.createElement("button");
    shadowBtn.style.setProperty("--interest-delay-start", "10ms");
    shadowBtn.style.setProperty("--interest-delay-end", "10ms");
    const innerTarget = document.createElement("div");
    shadow.append(shadowBtn, innerTarget);
    sandbox.appendChild(host);

    // Invoker inside shadow root can reference target in ancestor document tree
    shadowBtn.interestForElement = outerTarget;
    assert_equals(shadowBtn.interestForElement, outerTarget, "shadow invoker sees ancestor tree target");

    // Invoker in document cannot reference target inside a descendant shadow root
    const lightBtn = document.createElement("button");
    sandbox.appendChild(lightBtn);
    lightBtn.interestForElement = innerTarget;
    assert_equals(lightBtn.interestForElement, null, "light invoker cannot target inner shadow element");

    // Verify InterestEvent.source retargeting when event is observed in outer document
    let observedSource = null;
    outerTarget.addEventListener("interest", (e) => {
      observedSource = e.source;
    });
    hover(shadowBtn);
    await wait(25);
    assert_equals(observedSource, host, "InterestEvent.source retargets to shadow host");
  });

  await test("Disabled <button>, <a> without href, and non-invoker elements cannot show interest", async () => {
    const { invoker: disabledBtn, target: t1 } = createPair({
      invokerAttrs: { disabled: "" },
    });
    const anchorNoHref = document.createElement("a");
    anchorNoHref.setAttribute("interestfor", "t_nohref");
    anchorNoHref.style.setProperty("--interest-delay-start", "10ms");
    const t2 = document.createElement("div");
    t2.id = "t_nohref";
    t2.setAttribute("popover", "auto");
    sandbox.append(anchorNoHref, t2);

    let events = 0;
    t1.addEventListener("interest", () => events++);
    t2.addEventListener("interest", () => events++);

    hover(disabledBtn);
    hover(anchorNoHref);
    await wait(30);
    assert_equals(events, 0, "neither disabled button nor href-less anchor fires interest");

    // Enabling button and adding href makes them valid
    disabledBtn.removeAttribute("disabled");
    anchorNoHref.setAttribute("href", "#");
    await nextTick();
    hover(disabledBtn);
    hover(anchorNoHref);
    await wait(30);
    assert_equals(events, 2, "both fire interest once valid");
  });

  // =========================================================================
  section("3. Hover, Focus, Delays, Events & Cancellation");
  // =========================================================================

  await test("Hover gains interest after delay, opens popover, sets classes, and dehover loses interest", async () => {
    const { invoker, target } = createPair({ delayStart: "20ms", delayEnd: "20ms" });
    const events = [];
    target.addEventListener("interest", (e) => events.push(`interest:${e.source.tagName}`));
    target.addEventListener("loseinterest", (e) => events.push(`loseinterest:${e.source.tagName}`));

    hover(invoker);
    assert_false(target.matches(":popover-open"), "not open immediately");
    assert_equals(events.length, 0);

    await wait(35);
    assert_true(target.matches(":popover-open"), "open after start delay");
    assert_array_equals(events, ["interest:BUTTON"]);
    assert_true(invoker.classList.contains("interest-source"), "has interest-source class");
    assert_true(target.classList.contains("interest-target"), "has interest-target class");
    assert_equals(invoker.getAttribute("aria-expanded"), "true", "rich hint aria-expanded=true");

    dehover(invoker);
    assert_true(target.matches(":popover-open"), "still open immediately after mouseout");

    await wait(35);
    assert_false(target.matches(":popover-open"), "closed after end delay");
    assert_array_equals(events, ["interest:BUTTON", "loseinterest:BUTTON"]);
    assert_false(invoker.classList.contains("interest-source"));
    assert_false(target.classList.contains("interest-target"));
    assert_equals(invoker.getAttribute("aria-expanded"), "false");
  });

  await test("Dehovering before start delay cancels gaining interest; re-hovering before end delay cancels losing interest", async () => {
    const { invoker, target } = createPair({ delayStart: "30ms", delayEnd: "30ms" });
    let interestCount = 0;
    let loseCount = 0;
    target.addEventListener("interest", () => interestCount++);
    target.addEventListener("loseinterest", () => loseCount++);

    hover(invoker);
    await wait(10);
    dehover(invoker);
    await wait(35);
    assert_equals(interestCount, 0, "early mouseout cancelled interest gain");

    hover(invoker);
    await wait(45);
    assert_equals(interestCount, 1, "gained interest");

    dehover(invoker);
    await wait(10);
    hover(invoker);
    await wait(35);
    assert_equals(loseCount, 0, "re-hover cancelled interest loss");
    assert_equals(interestCount, 1, "did not fire duplicate interest event");
    assert_true(target.matches(":popover-open"));
  });

  await test("Focus and blur gain and lose interest, and shorthand --interest-delay works", async () => {
    const { invoker, target } = createPair({ delayStart: null, delayEnd: null });
    invoker.style.setProperty("--interest-delay", "0.015s 15ms");
    const events = [];
    target.addEventListener("interest", () => events.push("interest"));
    target.addEventListener("loseinterest", () => events.push("loseinterest"));

    focusIn(invoker);
    await wait(30);
    assert_array_equals(events, ["interest"]);
    assert_true(target.matches(":popover-open"));

    focusOut(invoker);
    await wait(30);
    assert_array_equals(events, ["interest", "loseinterest"]);
    assert_false(target.matches(":popover-open"));
  });

  await test("Canceling interest and loseinterest events with preventDefault()", async () => {
    const { invoker, target } = createPair({ delayStart: "15ms", delayEnd: "15ms" });
    let blockInterest = true;
    let blockLoseInterest = true;
    target.addEventListener("interest", (e) => {
      if (blockInterest) e.preventDefault();
    });
    target.addEventListener("loseinterest", (e) => {
      if (blockLoseInterest) e.preventDefault();
    });

    hover(invoker);
    await wait(30);
    assert_false(target.matches(":popover-open"), "preventDefault on interest stopped popover from opening");
    assert_false(invoker.classList.contains("interest-source"));

    blockInterest = false;
    dehover(invoker);
    hover(invoker);
    await wait(30);
    assert_true(target.matches(":popover-open"), "opened when interest not canceled");

    dehover(invoker);
    await wait(30);
    assert_true(target.matches(":popover-open"), "preventDefault on loseinterest kept popover open");
    assert_true(invoker.classList.contains("interest-source"));

    blockLoseInterest = false;
    hover(invoker);
    dehover(invoker);
    await wait(30);
    assert_false(target.matches(":popover-open"), "closed when loseinterest not canceled");
  });

  // =========================================================================
  section("4. Escape Key, Light Dismiss, Pre-Opened & Nested Popovers");
  // =========================================================================

  await test("Escape key immediately dismisses active interest invokers with non-cancelable loseinterest", async () => {
    const { invoker, target } = createPair({ delayStart: "10ms", delayEnd: "500ms" });
    let cancelableSeen = null;
    target.addEventListener("loseinterest", (e) => {
      cancelableSeen = e.cancelable;
      e.preventDefault();
    });

    hover(invoker);
    await wait(25);
    assert_true(target.matches(":popover-open"));

    pressEscape();
    assert_equals(cancelableSeen, false, "Escape loseinterest is not cancelable");
    assert_false(target.matches(":popover-open"), "popover closed immediately on Escape");
    assert_false(invoker.classList.contains("interest-source"));
  });

  await test("External hidePopover() synchronously triggers loseinterest via beforetoggle", async () => {
    const { invoker, target } = createPair({ delayStart: "10ms", delayEnd: "500ms" });
    let lost = false;
    target.addEventListener("loseinterest", () => {
      lost = true;
    });

    hover(invoker);
    await wait(25);
    assert_true(target.matches(":popover-open"));

    target.hidePopover();
    assert_true(lost, "loseinterest fired synchronously when popover hid");
    assert_false(invoker.classList.contains("interest-source"));
  });

  await test("Already-open popover is not closed when interest is lost", async () => {
    const { invoker, target } = createPair({
      popoverType: "manual",
      delayStart: "10ms",
      delayEnd: "10ms",
    });
    target.showPopover();
    assert_true(target.matches(":popover-open"));

    const events = [];
    target.addEventListener("interest", () => events.push("interest"));
    target.addEventListener("loseinterest", () => events.push("loseinterest"));

    hover(invoker);
    await wait(25);
    assert_array_equals(events, ["interest"]);

    dehover(invoker);
    await wait(25);
    assert_array_equals(events, ["interest", "loseinterest"]);
    assert_true(target.matches(":popover-open"), "pre-opened popover remains open after loseinterest");
    target.hidePopover();
  });

  await test("Nested interest invokers keep upstream popovers open while inner popover is hovered", async () => {
    const { invoker: outerInvoker, target: outerPopover } = createPair({
      targetId: "outer_pop",
      delayStart: "15ms",
      delayEnd: "25ms",
      targetHTML: '<button id="inner_invoker" interestfor="inner_pop">Inner</button>',
    });
    const innerInvoker = outerPopover.querySelector("#inner_invoker");
    innerInvoker.style.setProperty("--interest-delay-start", "15ms");
    innerInvoker.style.setProperty("--interest-delay-end", "25ms");

    const innerPopover = document.createElement("div");
    innerPopover.id = "inner_pop";
    innerPopover.setAttribute("popover", "auto");
    innerPopover.textContent = "Nested popover";
    sandbox.appendChild(innerPopover);

    hover(outerInvoker);
    await wait(30);
    assert_true(outerPopover.matches(":popover-open"), "outer popover open");

    // Move from outerInvoker into innerInvoker (inside outerPopover)
    dehover(outerInvoker);
    hover(innerInvoker);
    await wait(35);
    assert_true(outerPopover.matches(":popover-open"), "outer popover stays open");
    assert_true(innerPopover.matches(":popover-open"), "inner popover opens");

    // Move from innerInvoker into innerPopover itself
    dehover(innerInvoker);
    hover(innerPopover);
    await wait(35);
    assert_true(outerPopover.matches(":popover-open"), "outer stays open while hovering innerPopover");
    assert_true(innerPopover.matches(":popover-open"), "inner stays open while hovering innerPopover");

    // Leave innerPopover completely
    dehover(innerPopover);
    await wait(45);
    assert_false(innerPopover.matches(":popover-open"), "inner closes after leaving");
    assert_false(outerPopover.matches(":popover-open"), "outer closes after leaving");
  });

  // =========================================================================
  section("5. ::interest-button & Touch Long-Press (ExplicitInterest)");
  // =========================================================================

  await test("--interest-button-content creates .interest-button sibling that triggers ExplicitInterest on click", async () => {
    const { invoker, target } = createPair({ delayStart: "500ms", delayEnd: "15ms" });
    invoker.style.setProperty("--interest-button-content", '"?"');
    // Trigger mutation observer to re-evaluate interest button
    invoker.setAttribute("interestfor", target.id);
    await nextTick();

    const btn = invoker.nextElementSibling;
    assert_true(!!btn && btn.classList.contains("interest-button"), "interest-button span inserted after invoker");
    assert_equals(btn.getAttribute("aria-hidden"), "true");

    // Clicking the interest button opens immediately without waiting for 500ms start delay
    btn.click();
    assert_true(target.matches(":popover-open"), "opened immediately via interest button");

    // Dehovering or blurring the invoker does NOT lose ExplicitInterest
    dehover(invoker);
    focusOut(invoker);
    await wait(35);
    assert_true(target.matches(":popover-open"), "ExplicitInterest not lost on dehover/blur");

    // Escape closes it
    pressEscape();
    assert_false(target.matches(":popover-open"), "ExplicitInterest closed by Escape");

    // Removing --interest-button-content removes the button element on update
    invoker.style.removeProperty("--interest-button-content");
    invoker.setAttribute("interestfor", target.id);
    await nextTick();
    assert_false(invoker.nextElementSibling === btn, "interest-button removed when content cleared");
  });

  await test("Touch long-press cancellations on touchmove / early touchend", async () => {
    const { invoker, target } = createPair({ delayStart: "10ms", delayEnd: "10ms" });
    invoker.dispatchEvent(new Event("touchstart", { bubbles: true }));
    // Cancel immediately via touchmove
    invoker.dispatchEvent(new Event("touchmove", { bubbles: true }));
    invoker.dispatchEvent(new Event("touchend", { bubbles: true }));
    await wait(30);
    assert_false(target.matches(":popover-open"), "canceled touch did not open popover");
  });

  await test("Emulated mouseover and focusin after touchend do not show interest until non-touch input occurs", async () => {
    const { invoker, target } = createPair({ delayStart: "10ms", delayEnd: "10ms" });
    invoker.dispatchEvent(new PointerEvent("pointerover", { bubbles: true, pointerType: "touch" }));
    invoker.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerType: "touch" }));
    invoker.dispatchEvent(new Event("touchstart", { bubbles: true }));
    await wait(10);
    invoker.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerType: "touch" }));
    invoker.dispatchEvent(new PointerEvent("pointerout", { bubbles: true, pointerType: "touch" }));
    invoker.dispatchEvent(new Event("touchend", { bubbles: true }));
    // Emulated compatibility mouse and focus events arrive after touchend:
    await wait(5);
    hover(invoker);
    focusIn(invoker);
    await wait(25);
    assert_false(target.matches(":popover-open"), "post-touchend emulated mouseover/focusin ignored");

    // Switching to mouse re-enables hover interest:
    invoker.dispatchEvent(new PointerEvent("pointerover", { bubbles: true, pointerType: "mouse" }));
    hover(invoker);
    await wait(25);
    assert_true(target.matches(":popover-open"), "mouse pointerover re-enables hover interest");
  });
}
</script>

<!-- ===================================================================== -->
<!--                            END OF TESTS                               -->
<!-- ===================================================================== -->

<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 20px;
    color: #222;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  header h2 {
    margin: 0;
  }
  #summary {
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .pass-bg {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  .fail-bg {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  .running-bg {
    background-color: #fff3cd;
    color: #856404;
    border: 1px solid #ffeeba;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 960px;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 6px 10px;
    text-align: left;
  }
  th {
    background: #f5f5f5;
  }
  td.status {
    width: 60px;
    font-weight: 600;
    text-align: center;
  }
  td.pass {
    background-color: #d4edda;
    color: #155724;
  }
  td.fail {
    background-color: #f8d7da;
    color: #721c24;
  }
  tr.section-row td {
    background-color: #eef2f7;
    font-weight: 600;
    padding-top: 10px;
  }
  .error-detail {
    color: #721c24;
    font-family: monospace;
    font-size: 12px;
    margin-top: 4px;
    white-space: pre-wrap;
  }
  #sandbox {
    position: fixed;
    top: -9999px;
    left: -9999px;
  }
</style>

<header>
  <h2>Interestfor Polyfill Automated Test Suite</h2>
  <label>
    Target:
    <select id="target_select">
      <option value="src">src/interestfor.js</option>
      <option value="min">src/interestfor.min.js</option>
    </select>
  </label>
  <button id="rerun" type="button">Re-run</button>
</header>

<div id="summary" class="running-bg">Running tests...</div>
<table>
  <thead>
    <tr>
      <th>Status</th>
      <th>Test</th>
    </tr>
  </thead>
  <tbody id="log"></tbody>
</table>

<div id="sandbox"></div>

<script>
const params = new URLSearchParams(location.search);
const targetMode = params.get("target") === "min" ? "min" : "src";
const targetSelect = document.getElementById("target_select");
targetSelect.value = targetMode;
targetSelect.addEventListener("change", () => {
  const url = new URL(location.href);
  url.searchParams.set("target", targetSelect.value);
  location.href = url.toString();
});
document.getElementById("rerun").addEventListener("click", () => location.reload());

// Force the polyfill to install even in browsers with native support.
window.interestForUsePolyfillAlways = true;
const polyfillScript = document.createElement("script");
polyfillScript.src = targetMode === "min" ? "../src/interestfor.min.js" : "../src/interestfor.js";
const polyfillLoaded = new Promise((resolve, reject) => {
  polyfillScript.onload = resolve;
  polyfillScript.onerror = () => reject(new Error(`Failed to load ${polyfillScript.src}`));
});
document.head.appendChild(polyfillScript);

// Minimal test harness
const logBody = document.getElementById("log");
const sandbox = document.getElementById("sandbox");
let totalCount = 0;
let passCount = 0;
let failCount = 0;

function section(title) {
  const tr = document.createElement("tr");
  tr.className = "section-row";
  const td = document.createElement("td");
  td.colSpan = 2;
  td.textContent = title;
  tr.appendChild(td);
  logBody.appendChild(tr);
}

function recordResult(name, passed, errorMsg) {
  totalCount++;
  if (passed) {
    passCount++;
  } else {
    failCount++;
  }
  const tr = document.createElement("tr");
  const statusTd = document.createElement("td");
  statusTd.className = `status ${passed ? "pass" : "fail"}`;
  statusTd.textContent = passed ? "PASS" : "FAIL";
  const nameTd = document.createElement("td");
  nameTd.textContent = name;
  if (!passed && errorMsg) {
    const detail = document.createElement("div");
    detail.className = "error-detail";
    detail.textContent = errorMsg;
    nameTd.appendChild(detail);
  }
  tr.append(statusTd, nameTd);
  logBody.appendChild(tr);
}

async function test(name, fn) {
  sandbox.replaceChildren();
  try {
    await fn();
    recordResult(name, true);
  } catch (err) {
    console.error(`FAIL: ${name}`, err);
    recordResult(name, false, err && err.message ? err.message : String(err));
  } finally {
    sandbox.replaceChildren();
  }
}

function assert_true(cond, msg = "expected true") {
  if (!cond) {
    throw new Error(msg);
  }
}

function assert_false(cond, msg = "expected false") {
  if (cond) {
    throw new Error(msg);
  }
}

function assert_equals(actual, expected, msg = "") {
  if (!Object.is(actual, expected)) {
    const prefix = msg ? `${msg}: ` : "";
    throw new Error(`${prefix}expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}

function assert_array_equals(actual, expected, msg = "") {
  assert_equals(actual.length, expected.length, `${msg} (length)`);
  for (let i = 0; i < expected.length; i++) {
    assert_equals(actual[i], expected[i], `${msg} (index ${i})`);
  }
}

function assert_throws_js(ErrorConstructor, fn, msg = "") {
  let threw = false;
  try {
    fn();
  } catch (e) {
    threw = true;
    assert_true(
      e instanceof ErrorConstructor,
      `${msg}: expected ${ErrorConstructor.name}, got ${e}`
    );
  }
  assert_true(threw, `${msg}: expected ${ErrorConstructor.name} to be thrown`);
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const nextTick = () => wait(0);

function hover(el) {
  el.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, composed: true }));
}
function dehover(el) {
  el.dispatchEvent(new MouseEvent("mouseout", { bubbles: true, composed: true }));
}
function focusIn(el) {
  el.dispatchEvent(new FocusEvent("focusin", { bubbles: true, composed: true }));
}
function focusOut(el) {
  el.dispatchEvent(new FocusEvent("focusout", { bubbles: true, composed: true }));
}
function pressEscape(target = document.body) {
  return target.dispatchEvent(
    new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true })
  );
}

function createPair({
  invokerTag = "button",
  invokerAttrs = {},
  invokerHTML = "Invoker",
  targetId = "t_" + Math.random().toString(36).slice(2),
  popoverType = "auto",
  targetHTML = "Target content",
  delayStart = "15ms",
  delayEnd = "15ms",
} = {}) {
  const invoker = document.createElement(invokerTag);
  if (invokerTag === "a" && !("href" in invokerAttrs)) {
    invoker.setAttribute("href", "#");
  }
  invoker.setAttribute("interestfor", targetId);
  for (const [k, v] of Object.entries(invokerAttrs)) {
    invoker.setAttribute(k, v);
  }
  if (delayStart !== null) {
    invoker.style.setProperty("--interest-delay-start", delayStart);
  }
  if (delayEnd !== null) {
    invoker.style.setProperty("--interest-delay-end", delayEnd);
  }
  invoker.innerHTML = invokerHTML;

  const target = document.createElement("div");
  target.id = targetId;
  if (popoverType !== null) {
    target.setAttribute("popover", popoverType);
  }
  target.innerHTML = targetHTML;

  sandbox.append(invoker, target);
  return { invoker, target };
}

async function main() {
  await polyfillLoaded;
  if (document.readyState !== "complete") {
    await new Promise((r) => window.addEventListener("load", r, { once: true }));
  }
  await nextTick();

  await runTests();

  const summary = document.getElementById("summary");
  if (failCount === 0) {
    summary.className = "pass-bg";
    summary.textContent = `PASS — All ${passCount} tests passed (${targetSelect.options[targetSelect.selectedIndex].text})`;
  } else {
    summary.className = "fail-bg";
    summary.textContent = `FAIL — ${failCount} of ${totalCount} tests failed (${passCount} passed)`;
  }
  console.log(summary.textContent);
}

main();
</script>

<!DOCTYPE html>

<script src="../src/interestfor.js" async></script>

<div>
  <a interestfor=foo href=bar>Link - hover me</a>
</div>
<div>
  <button interestfor=foo commandfor=bar command=toggle-popover>Button - hover me</button>
</div>
<div popover id=foo>Hovercard</div>
<div popover id=bar>Button action</div>

<style>
  [interestfor] {
    --interest-delay: 600ms 500ms;
    interest-delay: var(--interest-delay);
  }
  :is([interestfor]:interest-source),
  [interestfor].interest-source {
    background-color: lightgreen;
  }
  :is([popover]:interest-target),
  [popover].interest-target {
    background-color: lightblue;
  }
  [popover] {
    position-area: right center;
    margin-left:30px;
  }
  div { margin: 10px; }
  /* Polyfilled ::interest-button */
  [interestfor] {
    --interest-button-content: "\24D8";
  }
  /* Native ::interest-button */
  [interestfor]::interest-button {
    content: var(--interest-button-content);
  }
</style>

<!DOCTYPE html>

<script src="../src/interestfor.js" async></script>

<a interestfor=foo href=bar>Link - hover me, don't click me</a>
<button interestfor=foo>
  <span style="margin:10px;">Button - hover me, don't click me</span></button>
<div popover id=foo>Popover</div>
<p>
  <a interestfor=bar href=bar class=with-button>Link with an interest button - click the "?"</a>
</p>
<div popover id=bar>Popover shown by the interest button</div>

<style>
  [interestfor] {
    interest-delay: 600ms 300ms;
    --interest-delay: 600ms 300ms;
  }
  :is([interestfor]:interest-source),
  [interestfor].interest-source {
    background-color: lightgreen;
  }
  :is([popover]:interest-target),
  [popover].interest-target {
    background-color: lightblue;
  }
  [popover] {
    position-area: right center;
  }
  /* Native ::interest-button */
  .with-button::interest-button {
    content: "?";
  }
  /* Polyfilled ::interest-button */
  .with-button {
    --interest-button-content: "?";
  }
</style>
